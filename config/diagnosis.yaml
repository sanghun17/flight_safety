# L1 diagnosis (flight_safety_diagnosis): per-subsystem reporters -> /diagnostics.
# OUTSIDE or a fresh VRPN-vs-EKF2 mismatch -> ERROR/KILL.  A VRPN-only outage is
# WARN/LAND while MAVROS local_position remains fresh; loss of local_position is
# still ERROR/KILL through the independent liveness reporter below.
rate_hz: 2.0

geofence:
  source: /vrpn_client_node/pure/pose                        # OptiTrack pose (NOT mavros)
  fallback_source: /mavros/local_position/pose              # availability only; never used to judge the box
  box: { x: [-2.5, 2.5], y: [-2.5, 2.5], z: [-0.5, 2.0] }     # m (boundary; kill wall)
  margin_m: 0.4            # within this of a wall -> APPROACHING (WARN -> land). land wall = box - margin = x/y +/-2.1
  pose_timeout_s: 0.5      # VRPN-only gap beyond this -> WARN/LAND when fallback remains fresh
  fallback_timeout_s: 0.5  # VRPN + local_position unavailable -> ERROR/KILL
  # rviz marker /flight_safety/geofence: wireframe box, status colors (green / yellow-red blink 3Hz /
  # red / gray) fixed in code; marker frame follows the vrpn pose header (set rviz Fixed Frame to it, e.g. odom).

consistency:
  topic_a: /vrpn_client_node/pure/pose
  topic_b: /mavros/local_position/pose
  sync_slop_s: 0.05
  pair_timeout_s: 0.5
  warn_m: 0.10             # WARN -> land
  error_m: 0.25            # fresh-pair mismatch -> ERROR/KILL; no/stale pair -> WARN/LAND

# Source liveness for inputs that do NOT self-report to /diagnostics -- names WHICH source died,
# independent of the cross-check. (vrpn pose is covered by its in-node 'pure stream'.)
liveness:
  local_position:
    topic: /mavros/local_position/pose
    stale_s: 0.5           # 30Hz topic; seen-then-silent > this -> ERROR(DEAD) -> kill
