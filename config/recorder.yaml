# Arm-triggered flight-safety recorder: ARM -> record, DISARM -> stop+finalize (one bag per flight).
# Records ONLY the safety verdicts + the minimal context to read them. Tiny; always-on.
bag_dir: /work/flight_logs
prefix: safety
record_all: true            # -a full capture (failure analysis). false로 바꾸면 아래 topics만 (가벼움).
exclude: '(/camera/color/image_raw(_10hz)?$)|(/camera/color/image_raw(_10hz)?/compressedDepth($|/.*))|(/camera/depth/image_rect_raw$)|(/camera/depth/color/points$)|(/camera/depth_overlay$)|(/recorder_cam[12]/.*)'  # record_all -> -a -x: drop raw realsense + invalid color compressedDepth + webcam
lz4: true
stop_settle: 10.0
# /recorder ROS 노드(std_srvs/Trigger) 같이 트리거 — ARM에서 .mp4 시작(recorder가 flight_<stamp>로 명명), DISARM에서 stop.
webcam_enable: true               # /recorder 노드 안 떠있으면 경고만 찍고 무해.
webcam_start_srv: /recorder/start # std_srvs/Trigger
webcam_stop_srv: /recorder/stop
webcam_timeout: 5.0               # wait_for_service 타임아웃(s)
# 실제 비행 odometry path도 동일 ARM 세션으로 초기화/기록/정지. 실패해도 bag/webcam에는 무해.
odom_history_enable: true
odom_history_start_srv: /robot_odom_history/start
odom_history_stop_srv: /robot_odom_history/stop
odom_history_timeout: 1.0

# Reproducibility sidecar.  ARM writes the start snapshot asynchronously;
# DISARM appends the end snapshot before <base>.ready is created.  The existing
# host watcher sends this YAML beside the bag and webcam files.
runtime_manifest_enable: true
runtime_manifest_suffix: .runtime_manifest.yaml
runtime_manifest_command_timeout_s: 6.0
runtime_manifest_git_diff_max_bytes: 262144
runtime_manifest_repo_paths:
  drone_stack: /work
  risk_aware: /work/ws/risk-aware/src/risk_aware_planning
  flight_safety: /work/ws/flight-safety/src/flight_safety
runtime_manifest_config_paths:
  planning: /work/ws/risk-aware/src/risk_aware_planning/mav_active_3d_planning/local_planner_mpc/config/planning.yaml
  ete_training: /work/ws/risk-aware/src/risk_aware_planning/uncertainty_predictor/src/ete_net/config/ete_train_config.yaml
  flight_safety_diagnosis: /work/ws/flight-safety/src/flight_safety/config/diagnosis.yaml
  flight_safety_monitor: /work/ws/flight-safety/src/flight_safety/config/monitor.yaml
  flight_safety_response: /work/ws/flight-safety/src/flight_safety/config/response.yaml
  flight_safety_recorder: /work/ws/flight-safety/src/flight_safety/config/recorder.yaml
  rviz: /work/rviz.rviz

# record_all:false 일 때 녹화셋 — 안전 verdict + goal/odom + 궤적 b-spline 전→후 + 최종 명령.
topics:
  # 안전 / 컨텍스트
  - /flight_safety/fault                  # L2 worst-severity verdict
  - /flight_safety/state                  # L3 unified flight-safety state
  - /diagnostics                          # L1 per-subsystem health
  - /mavros/state                         # arming/mode timeline
  # goal / odom
  - /planner/command/trajectory           # goal (point[1])
  - /robot/odom                           # control odom
  - /robot/odom_planning                  # planning odom (jax 입력)
  - /mavros/local_position/odom           # EKF2 fused
  - /aft_mapped_to_body_imu_propagated   # fast-livo world twist (jax context vel 소스 — 2026-07-10 오프라인 분석용 추가)
  # 궤적: b-spline 전 → 후 비교
  - /jax/optimal_trajectory               # b-spline 전 (raw JAX)
  - /planning/trajectory                  # MixTraj (b-spline 제어점)
  - /planning/pos_cmd                     # b-spline 후 (traj_server 50Hz)
  - /jax_to_mixtraj/raw_path              # 비교용 raw path
  - /jax_to_mixtraj/bspline_path          # 비교용 b-spline curve
  - /jax/debug_info                       # jax 내부 진단
  # 최종 명령
  - /local_controller/setpoint_raw/local  # control 출력 (MUX 전)
  - /mavros/setpoint_raw/local            # MUX 후 → FCU
